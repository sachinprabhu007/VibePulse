name: Deploy VibePulse to Hugging Face Spaces

on:
  push:
    branches:
      - v1-backup

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_SPACES_VIBEPULSE }}
        run: |
          git clone https://huggingface.co/spaces/sachinprabhu007/VibePulse hf-space
          rsync -av --exclude='.git/' ./ hf-space/
          cd hf-space
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto-deploy from GitHub (v1-backup)" || echo "No changes"
          git push https://huggingface.co/spaces/sachinprabhu007/VibePulse
